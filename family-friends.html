<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>පවුලේ හා යහලුවන්ගේ මතකයන්</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #111;
  color: #fff;
  margin: 0;
}

/* Title */
h1 {
  text-align: center;
  padding: 20px;
  color: #00eaff;
  text-shadow: 0 0 10px #00eaff;
}

/* Category Buttons */
.categories {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-bottom: 20px;
}

.categories button {
  background: #222;
  border: 2px solid #00eaff;
  padding: 10px 20px;
  border-radius: 10px;
  color: #fff;
  cursor: pointer;
  transition: 0.3s;
}

.categories button.active,
.categories button:hover {
  background: #00eaff;
  color: #111;
  transform: scale(1.1);
}

/* Gallery */
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 15px;
  padding: 20px;
  max-width: 1100px;
  margin: auto;
}

.gallery a {
  display: block;
  overflow: hidden;
  border-radius: 12px;
  transition: 0.4s;
}

.gallery a:hover {
  transform: scale(1.05);
  box-shadow: 0 10px 20px rgba(0,234,255,0.6);
}

.gallery img {
  width: 100%;
  display: block;
  transition: 0.5s;
}

.gallery a:hover img {
  transform: scale(1.1);
}

/* Lightbox */
#lightbox {
  display: none;
  position: fixed;
  top:0; left:0;
  width:100%; height:100%;
  background: rgba(0,0,0,0.95);
  justify-content: center;
  align-items: center;
  z-index: 1000;
}

#lightbox img {
  max-width: 90%;
  max-height: 80%;
  border-radius: 10px;
}

#close {
  position: absolute;
  top: 20px;
  right: 30px;
  font-size: 40px;
  cursor: pointer;
}

/* Floating Buttons */
.float-btn {
  position: fixed;
  right: 30px;
  background: #00eaff;
  color: #111;
  padding: 15px 25px;
  border-radius: 50px;
  font-weight: bold;
  text-decoration: none;
  box-shadow: 0 5px 15px rgba(0,234,255,0.6);
  transition: 0.3s;
  z-index: 999;
}

.float-btn:hover {
  transform: scale(1.1);
  box-shadow: 0 10px 20px rgba(0,234,255,0.8);
}
</style>
</head>

<!-- Lightbox -->
<div id="lightbox">
  <span id="close">&times;</span>
  <img id="lightbox-img">
</div>

<!-- Floating Buttons -->
<a href="index.html" class="float-btn" style="bottom: 90px;">මුල් පිටුවට</a>
<a href="gallery.html" class="float-btn" style="bottom: 30px;">පෙර පිටුවට</a>

<script>
// Lightbox
const links = document.querySelectorAll('.gallery a');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');

links.forEach(link => {
  link.addEventListener('click', e => {
    e.preventDefault();
    lightbox.style.display = 'flex';
    lightboxImg.src = link.href;
  });
});

document.getElementById('close').onclick = () => {
  lightbox.style.display = 'none';
};

lightbox.onclick = e => {
  if(e.target === lightbox) lightbox.style.display = 'none';
};

// Category Filter (no ALL)
const buttons = document.querySelectorAll('.categories button');

buttons.forEach(btn => {
  btn.addEventListener('click', () => {
    buttons.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    const cat = btn.dataset.category;

    links.forEach(link => {
      if(link.dataset.category === cat){
        link.style.display = 'block';
      } else {
        link.style.display = 'none';
      }
    });
  });
});
</script>
