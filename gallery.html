<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Photo Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .photo {
            margin: 10px;
            border: 2px solid #ddd;
            border-radius: 4px;
            overflow: hidden;
            width: 300px;
        }
        .photo img {
            width: 100%;
            height: auto;
        }
        .caption {
            text-align: center;
            padding: 10px;
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h1>Wedding Photo Gallery</h1>
    <div class="photo">
        <img src="image1.jpg" alt="Wedding Photo 1">
        <div class="caption">Wedding Photo 1</div>
    </div>
    <div class="photo">
        <img src="image2.jpg" alt="Wedding Photo 2">
        <div class="caption">Wedding Photo 2</div>
    </div>
    <div class="photo">
        <img src="image3.jpg" alt="Wedding Photo 3">
        <div class="caption">Wedding Photo 3</div>
    </div>
    <!-- Add more photos as needed -->
</body>
</html>
