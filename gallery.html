<style>
  body {
    font-family: 'Arial', sans-serif;
    background: #111;
    color: #fff;
    margin: 0;
    padding: 0;
  }

  h1 {
    text-align: center;
    padding: 20px 0;
    font-size: 2.5em;
    color: #ff69b4;
    text-shadow: 0 0 10px #ff69b4;
  }

  /* Category Buttons */
  .categories {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .categories button {
    background: #222;
    border: 2px solid #ff69b4;
    padding: 10px 20px;
    border-radius: 10px;
    color: #fff;
    cursor: pointer;
    font-size: 1em;
    transition: all 0.3s ease;
  }

  .categories button:hover, .categories button.active {
    background: #ff69b4;
    color: #111;
    transform: scale(1.1);
  }

  /* Gallery Grid */
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 15px;
    padding: 0 20px 40px;
    max-width: 1200px;
    margin: auto;
  }

  .gallery a {
    display: block;
    overflow: hidden;
    border-radius: 12px;
    position: relative;
    cursor: pointer;
    transition: transform 0.5s ease, box-shadow 0.5s ease;
  }

  .gallery a:hover {
    transform: scale(1.05) rotate(1deg);
    box-shadow: 0 15px 25px rgba(255, 105, 180, 0.7);
  }

  .gallery img {
    width: 100%;
    height: auto;
    display: block;
    transition: transform 0.5s ease;
  }

  .gallery a:hover img {
    transform: scale(1.1) rotate(-1deg);
  }

  /* Lightbox */
  #lightbox {
    display: none;
    position: fixed;
    top:0;
    left:0;
    width: 100%;
    height:100%;
    background: rgba(0,0,0,0.95);
    justify-content: center;
    align-items: center;
    z-index: 1000;
    flex-direction: column;
  }

  #lightbox img {
    max-width: 90%;
    max-height: 80%;
    border-radius: 12px;
    box-shadow: 0 0 25px #ff69b4;
    animation: fadeIn 0.5s ease;
  }

  #lightbox span {
    position: absolute;
    top: 20px;
    right: 30px;
    font-size: 40px;
    color: #fff;
    cursor: pointer;
    font-weight: bold;
  }

  @keyframes fadeIn {
    from {opacity: 0; transform: scale(0.9);}
    to {opacity:1; transform: scale(1);}
  }

  /* Floating Button Style */
  .float-btn {
    position: fixed;
    right: 30px;
    background: #ff69b4;
    color: #111;
    font-size: 1.2em;
    font-weight: bold;
    padding: 15px 25px;
    border-radius: 50px;
    box-shadow: 0 5px 15px rgba(255,105,180,0.6);
    cursor: pointer;
    text-decoration: none;
    z-index: 999;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .float-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 10px 20px rgba(255,105,180,0.8);
  }
</style>

<a href="index.html" class="float-btn" style="bottom: 30px;">මුල් පිටුවට</a>

<script>
  // Lightbox functionality
  const galleryLinks = document.querySelectorAll('.gallery a');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  const closeBtn = document.getElementById('close');

  galleryLinks.forEach(link => {
    link.addEventListener('click', e => {
      e.preventDefault();
      lightbox.style.display = 'flex';
      lightboxImg.src = link.dataset.full;
    });
  });

  closeBtn.addEventListener('click', () => {
    lightbox.style.display = 'none';
    lightboxImg.src = '';
  });

  lightbox.addEventListener('click', e => {
    if(e.target === lightbox) {
      lightbox.style.display = 'none';
      lightboxImg.src = '';
    }
  });

  // Category Filtering
  const categoryButtons = document.querySelectorAll('.categories button');
  categoryButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      categoryButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const cat = btn.dataset.category;

      galleryLinks.forEach(link => {
        if(cat === 'all' || link.dataset.category === cat) {
          link.style.display = 'block';
          link.style.animation = 'fadeIn 0.5s ease';
        } else {
          link.style.display = 'none';
        }
      });
    });
  });
</script>
