<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">

<title>My Gallery</title>
<style>
/* --- Lightbox Styling --- */
#lightbox {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.85);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    flex-direction: column;
}

#lightbox-img {
    max-width: 90%;
    max-height: 80%;
    border-radius: 10px;
    box-shadow: 0 0 20px #000;
}

#close, #prev, #next, #home {
    color: white;
    font-size: 30px;
    font-weight: bold;
    cursor: pointer;
    user-select: none;
    margin: 15px;
}

#close:hover, #prev:hover, #next:hover, #home:hover {
    color: #ff69b4;
}

.lightbox-controls {
    margin-top: 15px;
    display: flex;
    justify-content: center;
    gap: 20px;
    font-size: 22px;
}
</style>
</head>
